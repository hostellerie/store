name: Apply Store 0.7.0 functions wiring

on:
  push:
    branches:
      - feature/0.7.0-taxes-shipping-totals
    paths:
      - tools/apply-070-functions.py
      - .github/workflows/apply-070-functions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/0.7.0-taxes-shipping-totals

      - name: Apply functions.inc patch
        run: python3 tools/apply-070-functions.py

      - name: Validate syntax
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint functions.inc
        run: php -l functions.inc

      - name: Commit patched functions.inc
        shell: bash
        run: |
          if git diff --quiet -- functions.inc; then
              echo 'No functions.inc changes required.'
              exit 0
          fi
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add functions.inc
          git commit -m 'Wire Store 0.7.0 standard upgrade path [skip ci]'
          git push origin HEAD:feature/0.7.0-taxes-shipping-totals

name: Finalize Store 0.7.1 branch
on:
  push:
    branches: [feature/0.7.1-hardening]
    paths: [.github/workflows/finalize-071-branch.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.7.1-hardening
          fetch-depth: 0
      - name: Apply 0.7.1 hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_required(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
              s = s.replace(old, new, count)
              p.write_text(s)

          p = Path('plugin.xml')
          s = p.read_text().replace('<pi_version>0.7.0</pi_version>', '<pi_version>0.7.1</pi_version>')
          s = s.replace('https://github.com/Geeklog-Plugins/store', 'https://github.com/hostellerie/store')
          p.write_text(s)

          p = Path('autoinstall.php')
          s = p.read_text().replace('Store Plugin 0.7.0', 'Store Plugin 0.7.1')
          s = s.replace("'pi_version'      => '0.7.0'", "'pi_version'      => '0.7.1'")
          s = s.replace('https://github.com/Geeklog-Plugins/store', 'https://github.com/hostellerie/store')
          p.write_text(s)

          p = Path('functions.inc')
          s = p.read_text()
          s = s.replace('Store Plugin 0.7.0', 'Store Plugin 0.7.1', 1)
          s = s.replace("function plugin_getversion_store()\n{\n    return '0.7.0';\n}\n\nfunction plugin_chkVersion_store()\n{\n    return '0.7.0';",
                        "function plugin_getversion_store()\n{\n    return '0.7.1';\n}\n\nfunction plugin_chkVersion_store()\n{\n    return '0.7.1';", 1)
          old = """    if (version_compare($installed, '0.7.0', '<')) {
        require_once $_CONF['path'] . 'plugins/store/includes/upgrade070.php';
        if (!store_upgrade_to_070()) {
            COM_errorLog('Store Plugin: failed to migrate database to 0.7.0.');
            return false;
        }
    }

    DB_query("UPDATE {$_TABLES['plugins']} SET pi_version = '0.7.0', pi_gl_version = '2.1.1' WHERE pi_name = 'store'", 1);
    if (DB_error()) {
        COM_errorLog('Store Plugin: failed to update plugin metadata to 0.7.0.');
        return false;
    }"""
          new = """    if (version_compare($installed, '0.7.0', '<')) {
        require_once $_CONF['path'] . 'plugins/store/includes/upgrade070.php';
        if (!store_upgrade_to_070()) {
            COM_errorLog('Store Plugin: failed to migrate database to 0.7.0.');
            return false;
        }
    }

    if (version_compare($installed, '0.7.1', '<')) {
        require_once $_CONF['path'] . 'plugins/store/includes/upgrade071.php';
        if (!store_upgrade_to_071()) {
            COM_errorLog('Store Plugin: failed to migrate database to 0.7.1.');
            return false;
        }
    }

    DB_query("UPDATE {$_TABLES['plugins']} SET pi_version = '0.7.1', pi_gl_version = '2.1.1' WHERE pi_name = 'store'", 1);
    if (DB_error()) {
        COM_errorLog('Store Plugin: failed to update plugin metadata to 0.7.1.');
        return false;
    }"""
          if old not in s:
              raise SystemExit('0.7 upgrade block not found in functions.inc')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('admin/includes/routes-orders070.php')
          s = p.read_text().replace('Store Plugin 0.7.0', 'Store Plugin 0.7.1', 1)
          block = """    if (store_money_to_minor($shippingTax) !== 0) {
        $html .= '<tr><th colspan=\"3\">' . store_escape($lang['shipping_tax']) . '</th><th>'
            . store_format_price($shippingTax, $currency) . '</th></tr>';
    }

"""
          if block in s:
              s = s.replace(block, '', 1)
          p.write_text(s)

          p = Path('sql/mysql_install.php')
          s = p.read_text().replace('Store Plugin 0.7.0', 'Store Plugin 0.7.1', 1)
          if 'KEY store_shipping_method_tax_class (tax_class_id)' not in s:
              s = s.replace('  KEY store_shipping_method_code (code)\n) ENGINE=MyISAM',
                            '  KEY store_shipping_method_code (code),\n  KEY store_shipping_method_tax_class (tax_class_id)\n) ENGINE=MyISAM', 1)
          if 'KEY store_order_country (country_code)' not in s:
              s = s.replace('  KEY store_order_source (order_source),\n  KEY store_order_created (created)',
                            '  KEY store_order_source (order_source),\n  KEY store_order_country (country_code),\n  KEY store_order_created (created)', 1)
          p.write_text(s)

          for name in ('language/english.php', 'language/french.php', 'language/french_france.php'):
              p = Path(name)
              if p.exists():
                  p.write_text(p.read_text().replace("'version' => 'Version 0.7.0'", "'version' => 'Version 0.7.1'"))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          if '## 0.7.1' not in s:
              marker = '# Changelog\n\n'
              entry = """## 0.7.1 - 0.7 commerce hardening\n\n- Added an explicit 0.7.0 to 0.7.1 Geeklog upgrade path.\n- Normalized legacy price, order, line-item and payment monetary columns to `DECIMAL(12,4)`.\n- Added country and tax-class lookup indexes used by the tax/shipping engine.\n- Hardened tax/shipping references, duplicate codes, ranges and reference-safe deletes.\n- Integrated tax class, weight and dimensions into the main product editor.\n- Kept digital product logistics at zero.\n- Moved physical product technical details below the full public description.\n- Removed duplicate visual presentation of shipping tax in admin order totals.\n- Corrected Store metadata homepage to the current repository.\n\n### Upgrade\n\nInstallations already running Store 0.7.0 can use the standard Geeklog plugin upgrade action. Historical commercial snapshots are preserved; 0.7.1 does not recalculate past tax or shipping totals.\n\n"""
              s = s.replace(marker, marker + entry, 1) if marker in s else entry + s
              p.write_text(s)

          temporary = [
              '.github/workflows/apply-070-functions.yml',
              '.github/workflows/apply-070-compound-tax.yml',
              '.github/workflows/normalize-070-metadata.yml',
              '.github/workflows/finalize-070-stock.yml',
              '.github/workflows/apply-070-ui-feedback.yml',
              '.github/workflows/move-physical-details.yml',
              '.github/workflows/style-physical-details.yml',
              '.github/workflows/refine-product-technical-block.yml',
              '.github/workflows/integrate-product-commerce-editor.yml',
              '.github/workflows/integrate-product-commerce-editor-v2.yml',
              '.github/workflows/finalize-071.yml'
          ]
          for name in temporary:
              p = Path(name)
              if p.exists():
                  p.unlink()

          tools = Path('.github/tools')
          if tools.exists():
              for p in tools.glob('*070*'):
                  if p.is_file():
                      p.unlink()

          ci = Path('.github/workflows/store-070-alpha.yml')
          if ci.exists():
              s = ci.read_text().replace('permissions:\n  contents: write', 'permissions:\n  contents: read')
              ci.write_text(s)

      - name: Validate syntax and version markers
        run: |
          php -l functions.inc
          php -l autoinstall.php
          php -l includes/upgrade070.php
          php -l includes/upgrade071.php
          php -l admin/includes/commerce-guards.php
          php -l admin/includes/editor070.php
          php -l admin/includes/routes-editor070.php
          php -l admin/includes/routes-orders070.php
          php -l sql/mysql_install.php
          grep -q '<pi_version>0.7.1</pi_version>' plugin.xml
          grep -q "return '0.7.1';" functions.inc
          grep -q "pi_version.*0.7.1" autoinstall.php
          grep -q "upgrade071.php" functions.inc
          grep -q 'store_order_country' sql/mysql_install.php
          grep -q 'store_shipping_method_tax_class' sql/mysql_install.php
      - name: Commit finalized branch and remove this one-shot workflow
        run: |
          rm -f .github/workflows/finalize-071-branch.yml
          git config user.name hostellerie
          git config user.email hostellerie.org@gmail.com
          git add -A
          git commit -m "Finalize Store 0.7.1 hardening and upgrade path"
          git push origin HEAD:feature/0.7.1-hardening

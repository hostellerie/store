name: Finalize Store 0.7.1
on:
  push:
    branches: [feature/0.7.0-taxes-shipping-totals]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.7.0-taxes-shipping-totals
      - name: Patch 0.7.1
        shell: python
        run: |
          from pathlib import Path

          p=Path('plugin.xml'); s=p.read_text(); s=s.replace('<pi_version>0.7.0</pi_version>','<pi_version>0.7.1</pi_version>'); s=s.replace('https://github.com/Geeklog-Plugins/store','https://github.com/hostellerie/store'); p.write_text(s)
          p=Path('autoinstall.php'); s=p.read_text(); s=s.replace('Store Plugin 0.7.0','Store Plugin 0.7.1'); s=s.replace("'pi_version'      => '0.7.0'","'pi_version'      => '0.7.1'"); s=s.replace('https://github.com/Geeklog-Plugins/store','https://github.com/hostellerie/store'); p.write_text(s)

          p=Path('functions.inc'); s=p.read_text(); s=s.replace("return '0.7.0';\n}\n\nfunction plugin_chkVersion_store()\n{\n    return '0.7.0';","return '0.7.1';\n}\n\nfunction plugin_chkVersion_store()\n{\n    return '0.7.1';")
          old="""    if (version_compare($installed, '0.7.0', '<')) {
        require_once $_CONF['path'] . 'plugins/store/includes/upgrade070.php';
        if (!store_upgrade_to_070()) {
            COM_errorLog('Store Plugin: failed to migrate database to 0.7.0.');
            return false;
        }
    }

    DB_query("UPDATE {$_TABLES['plugins']} SET pi_version = '0.7.0', pi_gl_version = '2.1.1' WHERE pi_name = 'store'", 1);
    if (DB_error()) {
        COM_errorLog('Store Plugin: failed to update plugin metadata to 0.7.0.');
        return false;
    }"""
          new="""    if (version_compare($installed, '0.7.0', '<')) {
        require_once $_CONF['path'] . 'plugins/store/includes/upgrade070.php';
        if (!store_upgrade_to_070()) {
            COM_errorLog('Store Plugin: failed to migrate database to 0.7.0.');
            return false;
        }
    }

    if (version_compare($installed, '0.7.1', '<')) {
        require_once $_CONF['path'] . 'plugins/store/includes/upgrade071.php';
        if (!store_upgrade_to_071()) {
            COM_errorLog('Store Plugin: failed to migrate database to 0.7.1.');
            return false;
        }
    }

    DB_query("UPDATE {$_TABLES['plugins']} SET pi_version = '0.7.1', pi_gl_version = '2.1.1' WHERE pi_name = 'store'", 1);
    if (DB_error()) {
        COM_errorLog('Store Plugin: failed to update plugin metadata to 0.7.1.');
        return false;
    }"""
          if old not in s: raise SystemExit('functions upgrade block not found')
          s=s.replace(old,new,1); s=s.replace('Store Plugin 0.7.0','Store Plugin 0.7.1',1); p.write_text(s)

          p=Path('admin/includes/routes-orders070.php'); s=p.read_text();
          block="""    if (store_money_to_minor($shippingTax) !== 0) {
        $html .= '<tr><th colspan=\"3\">' . store_escape($lang['shipping_tax']) . '</th><th>'
            . store_format_price($shippingTax, $currency) . '</th></tr>';
    }

"""
          s=s.replace(block,''); s=s.replace('Store Plugin 0.7.0','Store Plugin 0.7.1'); p.write_text(s)

          p=Path('sql/mysql_install.php'); s=p.read_text(); s=s.replace('Store Plugin 0.7.0','Store Plugin 0.7.1')
          s=s.replace('KEY store_order_source (order_source),\n  KEY store_order_created (created)','KEY store_order_source (order_source),\n  KEY store_order_country (country_code),\n  KEY store_order_created (created)')
          s=s.replace('KEY store_shipping_method_code (code)\n) ENGINE=MyISAM','KEY store_shipping_method_code (code),\n  KEY store_shipping_method_tax_class (tax_class_id)\n) ENGINE=MyISAM')
          p.write_text(s)

          for f in ['language/english.php','language/french.php','language/french_france.php']:
              p=Path(f); s=p.read_text().replace("'version' => 'Version 0.7.0'","'version' => 'Version 0.7.1'"); p.write_text(s)

          p=Path('CHANGELOG.md'); s=p.read_text();
          entry="""## 0.7.1\n\n- Incremented the plugin version for upgrades from the previously distributed 0.7.0 alpha.\n- Added a dedicated 0.7.0 → 0.7.1 migration.\n- Normalized legacy monetary columns to DECIMAL(12,4).\n- Added lookup indexes for country and tax-class references.\n- Hardened tax/shipping reference validation and deletion guards.\n- Integrated tax class, weight and dimensions into the main product editor.\n- Moved physical product details below the full public description.\n- Removed duplicate visual presentation of shipping tax in admin order totals.\n\n"""
          if not s.startswith('## 0.7.1'):
              s=entry+s
          p.write_text(s)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint
        run: |
          php -l functions.inc
          php -l autoinstall.php
          php -l includes/upgrade071.php
          php -l admin/includes/routes-orders070.php
          php -l sql/mysql_install.php
      - name: Commit
        run: |
          git config user.name hostellerie
          git config user.email hostellerie.org@gmail.com
          git add .
          git commit -m "Finalize Store 0.7.1 upgrade and totals hardening" || exit 0
          git push

name: Finalize Store 0.7.0 stock compatibility

on:
  push:
    branches:
      - feature/0.7.0-taxes-shipping-totals
    paths:
      - tools/finalize-070-stock.py
      - .github/workflows/finalize-070-stock.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/0.7.0-taxes-shipping-totals

      - name: Apply stock compatibility cleanup
        run: python3 tools/finalize-070-stock.py

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint order engines
        run: |
          php -l includes/orders070.php
          php -l includes/pos070.php

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
              echo 'No stock compatibility changes required.'
              exit 0
          fi
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add includes/orders070.php includes/pos070.php
          git commit -m 'Remove nonessential DB affected-row dependency [skip ci]'
          git push origin HEAD:feature/0.7.0-taxes-shipping-totals

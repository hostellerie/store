name: Store 0.7.0 alpha checks

on:
  push:
    branches:
      - feature/0.7.0-taxes-shipping-totals
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '5.6'
          - '8.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
              php -l "$file"
          done < <(find . -type f \( -name '*.php' -o -name 'functions.inc' \) -print0)

      - name: Reject tab indentation
        shell: bash
        run: |
          if grep -RIn $'^\t' --include='*.php' --include='functions.inc' .; then
              echo 'Tab-indented PHP lines found. Store uses four spaces.'
              exit 1
          fi

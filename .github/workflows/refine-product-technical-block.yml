name: Refine Store product technical block

on:
  push:
    branches:
      - feature/0.7.0-taxes-shipping-totals
    paths:
      - .github/workflows/refine-product-technical-block.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.7.0-taxes-shipping-totals

      - name: Style technical details block
        shell: python
        run: |
          from pathlib import Path

          path = Path('functions.inc')
          text = path.read_text()
          anchor = ".store-product-description h2{margin-top:0}.store-product-description div{line-height:1.7}"
          extra = ".store-product-technical{margin-top:18px;padding:20px 24px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.04)}.store-product-technical h2{margin:0 0 14px}.store-product-technical-list{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 22px;margin:0}.store-product-technical-list dt{font-weight:700;color:#374151}.store-product-technical-list dd{margin:0;color:#111827}"
          if extra not in text:
              if anchor not in text:
                  raise SystemExit('Product description CSS anchor not found')
              text = text.replace(anchor, anchor + extra, 1)
              path.write_text(text)

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint functions.inc
        run: php -l functions.inc

      - name: Commit changes
        run: |
          git config user.name hostellerie
          git config user.email hostellerie.org@gmail.com
          git add functions.inc
          git commit -m "Style product technical details block" || exit 0
          git push

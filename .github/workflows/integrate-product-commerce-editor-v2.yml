name: Integrate Store product commerce editor v2

on:
  push:
    branches:
      - feature/0.7.0-taxes-shipping-totals
    paths:
      - .github/workflows/integrate-product-commerce-editor-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.7.0-taxes-shipping-totals

      - name: Patch product editor and save route
        shell: python
        run: |
          from pathlib import Path

          p = Path('admin/includes/editor.php')
          s = p.read_text()
          if 'store-product-commerce-panel' not in s:
              anchor = "    $html .= '<section class=\"store-admin-panel store-primary-image-panel\">';"
              i = s.find(anchor)
              if i < 0:
                  raise SystemExit('primary image anchor not found')
              block = '''    $weightUnit = isset($_STORE_CONF['weight_unit']) ? $_STORE_CONF['weight_unit'] : 'kg';
    $dimensionUnit = isset($_STORE_CONF['dimension_unit']) ? $_STORE_CONF['dimension_unit'] : 'cm';
    $html .= '<section class="store-admin-panel store-product-commerce-panel">';
    $html .= '<h2>' . store_escape($LANG_STORE_COMMERCE['product_tax_shipping']) . '</h2>';
    $html .= '<label>' . store_escape($LANG_STORE_COMMERCE['tax_class']) . '</label>'
        . store_commerce_tax_class_select(isset($product['tax_class_id']) ? $product['tax_class_id'] : 0, 'tax_class_id');
    $html .= '<div id="store-product-logistics-fields"><div class="store-product-commerce-grid">';
    $html .= '<div><label>' . store_escape($LANG_STORE_COMMERCE['weight']) . ' (' . store_escape($weightUnit) . ')</label><input type="number" min="0" step="0.0001" name="weight" value="' . store_escape(isset($product['weight']) ? $product['weight'] : '0.0000') . '"></div>';
    $html .= '<div><label>' . store_escape($LANG_STORE_COMMERCE['length']) . ' (' . store_escape($dimensionUnit) . ')</label><input type="number" min="0" step="0.0001" name="length" value="' . store_escape(isset($product['length']) ? $product['length'] : '0.0000') . '"></div>';
    $html .= '<div><label>' . store_escape($LANG_STORE_COMMERCE['width']) . ' (' . store_escape($dimensionUnit) . ')</label><input type="number" min="0" step="0.0001" name="width" value="' . store_escape(isset($product['width']) ? $product['width'] : '0.0000') . '"></div>';
    $html .= '<div><label>' . store_escape($LANG_STORE_COMMERCE['height']) . ' (' . store_escape($dimensionUnit) . ')</label><input type="number" min="0" step="0.0001" name="height" value="' . store_escape(isset($product['height']) ? $product['height'] : '0.0000') . '"></div>';
    $html .= '</div><p class="store-meta">' . store_escape($LANG_STORE_COMMERCE['physical_shipping_help']) . '</p></div></section>';

'''
              s = s[:i] + block + s[i:]

          if 'var logisticsFields=document.getElementById("store-product-logistics-fields")' not in s:
              s = s.replace(
                  ". 'var stockRow=document.getElementById(\"store-stock-row\");'",
                  ". 'var stockRow=document.getElementById(\"store-stock-row\");'\n        . 'var logisticsFields=document.getElementById(\"store-product-logistics-fields\");'",
                  1
              )
          old = ". 'function updateStock(){if(!typeField||!stockRow){return;}stockRow.style.display=typeField.value===\"digital\"?\"none\":\"block\";}'"
          if old in s:
              s = s.replace(old,
                  ". 'function updateStock(){if(!typeField){return;}var digital=typeField.value===\"digital\";if(stockRow){stockRow.style.display=digital?\"none\":\"block\";}if(logisticsFields){logisticsFields.style.display=digital?\"none\":\"block\";}}'",
                  1)
          p.write_text(s)

          p = Path('admin/includes/routes-core.php')
          s = p.read_text()
          if "$taxClassId = isset($_POST['tax_class_id'])" not in s:
              anchor = "        $active = isset($_POST['active']) ? 1 : 0;"
              insert = '''        $taxClassId = isset($_POST['tax_class_id']) ? max(0, (int) $_POST['tax_class_id']) : 0;
        if ($taxClassId > 0) {
            $validTaxClass = DB_getItem($_TABLES['store_tax_classes'], 'id', 'id = ' . $taxClassId . ' AND active = 1');
            if ((int) $validTaxClass !== $taxClassId) {
                $taxClassId = 0;
            }
        }
        $weight = number_format(max(0, isset($_POST['weight']) ? (float) $_POST['weight'] : 0), 4, '.', '');
        $length = number_format(max(0, isset($_POST['length']) ? (float) $_POST['length'] : 0), 4, '.', '');
        $width = number_format(max(0, isset($_POST['width']) ? (float) $_POST['width'] : 0), 4, '.', '');
        $height = number_format(max(0, isset($_POST['height']) ? (float) $_POST['height'] : 0), 4, '.', '');
        if ($type === 'digital') {
            $weight = $length = $width = $height = '0.0000';
        }
'''
              pos = s.find(anchor)
              if pos < 0:
                  raise SystemExit('active anchor not found')
              s = s[:pos] + insert + s[pos:]

          s = s.replace(
              ". \"currency='$currencyDb',stock=$stock,product_type='$typeDb',active=$active,\"\n                        . \"modified=NOW() WHERE id=$id\");",
              ". \"currency='$currencyDb',stock=$stock,product_type='$typeDb',active=$active,\"\n                        . \"tax_class_id=$taxClassId,weight='$weight',length='$length',width='$width',height='$height',\"\n                        . \"modified=NOW() WHERE id=$id\");",
              1)
          s = s.replace(
              ". \"currency,stock,product_type,active,created,modified) VALUES \"\n                        . \"($categoryId,'$skuDb','$slugDb','$nameDb','$shortDb','$descriptionDb',\"\n                        . \"'$imageDb','$priceDb','$currencyDb',$stock,'$typeDb',$active,NOW(),NOW())\");",
              ". \"currency,stock,product_type,active,tax_class_id,weight,length,width,height,created,modified) VALUES \"\n                        . \"($categoryId,'$skuDb','$slugDb','$nameDb','$shortDb','$descriptionDb',\"\n                        . \"'$imageDb','$priceDb','$currencyDb',$stock,'$typeDb',$active,$taxClassId,'$weight','$length','$width','$height',NOW(),NOW())\");",
              1)
          p.write_text(s)

          p = Path('functions.inc')
          s = p.read_text()
          if '.store-product-commerce-grid{' not in s:
              s = s.replace('.store-form textarea{min-height:100px}', '.store-form textarea{min-height:100px}.store-product-commerce-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.store-product-commerce-grid label{margin-top:0}@media(max-width:780px){.store-product-commerce-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}', 1)
              p.write_text(s)

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate
        run: |
          php -l admin/includes/editor.php
          php -l admin/includes/routes-core.php
          php -l functions.inc
          grep -q 'store-product-commerce-panel' admin/includes/editor.php
          grep -q 'tax_class_id=$taxClassId' admin/includes/routes-core.php

      - name: Commit
        run: |
          git config user.name hostellerie
          git config user.email hostellerie.org@gmail.com
          git add admin/includes/editor.php admin/includes/routes-core.php functions.inc
          git commit -m "Integrate tax and shipping fields into product editor" || exit 0
          git push
